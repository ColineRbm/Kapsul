<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kapsul | Home</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Ajout bibliothèque Lucide pour icônes -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h2>Kapsul</h2>
        <ul>
          <li>🏡 Dashboard</li>
          <li>💰 Transactions</li>
          <li>📊 Statistiques</li>
          <li>⚙️ Paramètres</li>
        </ul>
      </aside>
      <div class="content">
        <header class="topbar">
          <h1>Dashboard</h1>
        </header>
        <main>
          <section class="summary">
            <div class="card">
              <span class="card-label">Solde total</span>
              <span class="card-amount" id="solde-total">0,00 €</span>
            </div>
            <div class="card">
              <span class="card-label">Revenus du mois</span>
              <span class="card-amount income" id="total-revenus">0,00 €</span>
            </div>
            <div class="card">
              <span class="card-label">Dépenses du mois</span>
              <span class="card-amount expense" id="total-depenses"
                >0,00 €</span
              >
            </div>
          </section>
          <section class="form-section">
            <h2>Ajouter une transaction</h2>
            <div class="form-div">
              <input type="text" id="description" placeholder="Description" />
              <input type="number" id="montant" placeholder="Montant (€)" />
              <select id="type">
                <option value="income">Revenu</option>
                <option value="expense">Dépense</option>
              </select>
              <select id="categorie">
                <option value="alimentation">Alimentation</option>
                <option value="logement">Logement</option>
                <option value="transport">Transport</option>
                <option value="salaire">Salaire</option>
                <option value="loisirs">Loisirs</option>
                <option value="autres">Autres</option>
              </select>
              <button id="button-add">Ajouter</button>
            </div>
          </section>
          <section class="transactions-section">
            <h2>Transactions</h2>
            <div id="transactions-list"></div>
          </section>
        </main>
      </div>
    </div>
    <footer></footer>
    <script src="script.js"></script>
  </body>
</html>
