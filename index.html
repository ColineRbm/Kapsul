<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kapsul | Home</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h2>Kapsul</h2>
        <ul>
          <li>🏡 Dashboard</li>
          <li>💰 Transactions</li>
          <li>📊 Statistiques</li>
          <li>⚙️ Paramètres</li>
        </ul>
      </aside>
      <div class="content">
        <header class="topbar">
          <h1>Dashboard</h1>
        </header>
        <main>
          <section class="summary">
            <div class="card">
              <span class="card-label">Solde total</span>
              <span class="card-amount">2 450,00 €</span>
            </div>
            <div class="card">
              <span class="card-label">Revenus du mois</span>
              <span class="card-amount income">+ 3 200,00 €</span>
            </div>
            <div class="card">
              <span class="card-label">Dépenses du mois</span>
              <span class="card-amount expense">- 750,00 €</span>
            </div>
          </section>
          <section>Formulaire</section>
          <section>Liste transactions</section>
        </main>
      </div>
    </div>
    <footer></footer>
  </body>
</html>
