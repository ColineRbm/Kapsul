<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kapsul | Statistiques</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="style-stats.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="mobile-header">
      <a href="../landing.html">Kapsul</a>
    </div>
    <div class="app">
      <aside class="sidebar">
        <div class="logo-block">
          <a href="../landing.html" class="logo">Kapsul</a>
          <span class="logo-sub">Budget perso</span>
        </div>
        <nav>
          <a href="../transactions/index.html">
            <span class="nav-emoji">💰</span>
            <span>Transactions</span>
          </a>
          <a href="statistiques.html" class="active">
            <span class="nav-emoji">📊</span>
            <span>Statistiques</span>
          </a>
          <a href="../params/parametres.html">
            <span class="nav-emoji">⚙️</span>
            <span>Paramètres</span>
          </a>
        </nav>
        <a href="../params/parametres.html" class="sidebar-footer">
          <div class="avatar" id="sidebar-avatar">K</div>
          <div>
            <div class="user-name" id="sidebar-username">Mon compte</div>
            <div class="user-plan">Kapsul</div>
          </div>
        </a>
      </aside>

      <div class="content">
        <header class="topbar">
          <h1>Statistiques</h1>
          <span class="topbar-badge" id="mois-badge"></span>
        </header>

        <main>
          <section class="summary">
            <div class="card accent">
              <span class="card-label">Solde total</span>
              <span class="card-amount" id="solde-total">0,00 €</span>
            </div>
            <div class="card">
              <span class="card-label">Revenus</span>
              <span class="card-amount income" id="total-revenus">0,00 €</span>
            </div>
            <div class="card">
              <span class="card-label">Dépenses</span>
              <span class="card-amount expense" id="total-depenses"
                >0,00 €</span
              >
            </div>
          </section>

          <section class="stats-grid">
            <div class="stats-card">
              <h3>Dépenses par catégorie</h3>
              <div id="donut-container"></div>
            </div>
            <div class="stats-card">
              <h3>Évolution du solde</h3>
              <div id="courbe-container"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- Tab bar mobile — EN DEHORS du .app -->
    <nav class="tab-bar">
      <a href="../transactions/index.html">
        <span class="tab-emoji">💰</span>
        <span>Transactions</span>
      </a>
      <a href="statistiques.html" class="active">
        <span class="tab-emoji">📊</span>
        <span>Stats</span>
      </a>
      <a href="../params/parametres.html">
        <span class="tab-emoji">⚙️</span>
        <span>Paramètres</span>
      </a>
    </nav>

    <script src="stats.js"></script>
    <script>
      const mois = new Date().toLocaleDateString("fr-FR", {
        month: "long",
        year: "numeric",
      });
      document.getElementById("mois-badge").textContent =
        mois.charAt(0).toUpperCase() + mois.slice(1);
    </script>
  </body>
</html>
